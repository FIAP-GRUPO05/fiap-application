name: Phase 3 Pipeline
'on':
  push:
    branches:
    - feature/**
    - rollback/**
    - rolback/**
    - develop
    - release/**
    - prod
  pull_request:
    branches:
    - develop
    - release/**
    - prod
    - main
    types:
    - opened
    - reopened
    - synchronize
concurrency:
  group: pipeline-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  route:
    name: Route
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: 00 - Distinguir manutenção e operação destrutiva
      id: operation
      env:
        FIAP_INFRA_STATE: ${{ vars.FIAP_INFRA_STATE }}
        SOURCE: ${{ github.event.pull_request.head.ref || github.ref_name }}
        BASE: ${{ github.event.pull_request.base.ref }}
        BRANCH: ${{ github.ref_name }}
      shell: bash
      run: |
        set -euo pipefail
        state="${FIAP_INFRA_STATE:-active}"
        case "$state" in active|maintenance|destroying|destroyed) ;; *) echo '::error::Estado de infraestrutura inválido'; exit 1 ;; esac
        maintenance=false
        if [[ "$state" != active ]]; then maintenance=true; fi
        operational=false
        if [[ "$SOURCE" == feature/destroy-infra-aws || "$BASE" == ALL || "$BRANCH" == ALL ]]; then
          operational=true
        fi
        echo "infra_state=$state" >> "$GITHUB_OUTPUT"
        echo "maintenance=$maintenance" >> "$GITHUB_OUTPUT"
        echo "destroy_request=$operational" >> "$GITHUB_OUTPUT"
        if [[ "$state" == maintenance ]]; then echo 'Manutenção: validações de código e PRs automáticos liberados; deploys bloqueados.'; elif [[ "$maintenance" == true ]]; then echo 'Desmontagem: publicações e promoções normais bloqueadas.'; fi
        if [[ "$operational" == true ]]; then echo '::error::Solicite destroy no repositório FIAP-GRUPO05/fiap-k8s'; exit 1; fi
    - name: 00 - Validar a origem e o destino do PR
      if: github.event_name == 'pull_request'
      env:
        HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      shell: bash
      run: |
        case "$BASE_BRANCH:$HEAD_BRANCH" in
          develop:feature/*|release/*:develop|release/*:rollback/*|release/*:rolback/*|prod:release/*|main:prod) ;;
          *) echo "::error::Rota proibida: $HEAD_BRANCH → $BASE_BRANCH. Use feature/* → develop → release/vX.Y.Z → prod → main; rollback/* → release/vX.Y.Z."; exit 1 ;;
        esac
        if [[ "$BASE_BRANCH" == release/* && ! "$BASE_BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::A release deve ter formato release/vX.Y.Z'; exit 1
        fi
        if [[ "$HEAD_BRANCH" == release/* && ! "$HEAD_BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::A release deve ter formato release/vX.Y.Z'; exit 1
        fi
    - name: 00 - Validar o nome da branch enviada
      if: github.event_name == 'push'
      env:
        SOURCE_BRANCH: ${{ github.ref_name }}
      shell: bash
      run: |
        if [[ ! "$SOURCE_BRANCH" =~ ^(feature|rollback|rolback)/[a-z0-9][a-z0-9._/-]*$ &&
              "$SOURCE_BRANCH" != develop && "$SOURCE_BRANCH" != prod &&
              ! "$SOURCE_BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::Use feature/<descricao>, rollback/<descricao>, develop, release/vX.Y.Z ou prod.'; exit 1
        fi
    - name: 00 - Explicar a promoção simples para main
      if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
      run: echo 'prod → main é somente um PR com merge manual; nenhuma esteira de build/deploy é executada.'
    outputs:
      maintenance: ${{ steps.operation.outputs.maintenance }}
      destroy_request: ${{ steps.operation.outputs.destroy_request }}
      infra_state: ${{ steps.operation.outputs.infra_state }}
  verify:
    name: Verify
    needs: route
    if: |-
      (needs.route.outputs.infra_state == 'active' || needs.route.outputs.infra_state == 'maintenance' || startsWith(github.ref_name, 'feature/') || github.event.pull_request.base.ref == 'develop') && needs.route.outputs.destroy_request != 'true' && (github.event_name == 'push' && (startsWith(github.ref_name, 'feature/') || !github.event.created &&
       (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/') || github.ref_name == 'prod')) ||
      github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' && !startsWith(github.event.pull_request.head.ref, 'rollback/') && !startsWith(github.event.pull_request.head.ref, 'rolback/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: 01 - Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
      id: check_0
    - name: Validar rotas de promocao e SemVer
      run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      id: check_1
    - name: 01a - Autenticar na AWS TWM por OIDC
      if: needs.route.outputs.infra_state == 'active' && (github.event_name == 'pull_request')
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-region: sa-east-1
        role-to-assume: arn:aws:iam::456687462806:role/fiap-gh-preflight-fiap-application
        allowed-account-ids: '456687462806'
      id: check_2
    - name: 01b - Confirmar identidade AWS
      if: needs.route.outputs.infra_state == 'active' && (github.event_name == 'pull_request')
      run: aws sts get-caller-identity --query Arn --output text
      id: check_3
    - name: 02 - JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
      id: check_4
    - name: 03 - Gradle
      uses: gradle/actions/setup-gradle@v5
      id: check_5
    - name: 04 - Build e testes
      run: ./gradlew clean build --no-daemon
      id: check_6
    - name: 05 - Cobertura mínima de 90%
      if: needs.route.outputs.infra_state == 'maintenance' || (github.event_name == 'pull_request' || github.ref_name == 'develop'
        || startsWith(github.ref_name, 'release/') || github.ref_name == 'prod')
      run: ./gradlew jacocoTestCoverageVerification --no-daemon
      id: check_7
    - name: Validar Terraform do registro de imagens
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
      id: check_8
    - name: Build Terraform sem backend remoto
      run: |
        terraform -chdir=infra/registry fmt -check
        terraform -chdir=infra/registry init -backend=false -input=false
        terraform -chdir=infra/registry validate
      id: check_9
    - name: 06 - Segurança de dependências e configuração
      if: needs.route.outputs.infra_state == 'maintenance' || (github.event_name == 'pull_request' || github.ref_name == 'develop'
        || startsWith(github.ref_name, 'release/') || github.ref_name == 'prod')
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,misconfig,secret
        severity: HIGH,CRITICAL
        exit-code: '1'
      id: check_10
    - name: 07 - Observabilidade New Relic configurada
      if: needs.route.outputs.infra_state == 'maintenance' || (github.event_name == 'pull_request' || github.ref_name == 'develop'
        || startsWith(github.ref_name, 'release/') || github.ref_name == 'prod')
      shell: bash
      run: |
        grep -q 'newrelic-api' build.gradle
        grep -Riq 'com.newrelic' src/main/java
        echo 'API New Relic presente; o agente do EKS é validado no repositório fiap-k8s.'
      id: check_11
    - name: 08 - Conectividade externa real do ambiente de origem
      if: needs.route.outputs.infra_state == 'active' && (github.event_name == 'pull_request' && github.event.pull_request.base.ref
        != 'develop')
      env:
        FIAP_RUNTIME_CONFIG: ${{ vars.FIAP_RUNTIME_CONFIG }}
        SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      run: python .github/scripts/verify_external.py
      id: check_12
    - name: 09 - Regressão de endpoints
      if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'prod'
      run: python .github/scripts/regression_inventory.py
      id: check_13
    - name: Resumo das validações executadas e pendências externas
      id: validation_summary
      if: always()
      env:
        FIAP_INFRA_STATE: ${{ needs.route.outputs.infra_state }}
        CI_JOB_STATUS: ${{ job.status }}
        CI_VALIDATION_STEPS: '[{"name": "01 - Checkout", "outcome": "${{ steps.check_0.outcome }}"}, {"name": "Validar rotas
          de promocao e SemVer", "outcome": "${{ steps.check_1.outcome }}"}, {"name": "01a - Autenticar na AWS TWM por OIDC",
          "outcome": "${{ steps.check_2.outcome }}"}, {"name": "01b - Confirmar identidade AWS", "outcome": "${{ steps.check_3.outcome
          }}"}, {"name": "02 - JDK 21", "outcome": "${{ steps.check_4.outcome }}"}, {"name": "03 - Gradle", "outcome": "${{
          steps.check_5.outcome }}"}, {"name": "04 - Build e testes", "outcome": "${{ steps.check_6.outcome }}"}, {"name":
          "05 - Cobertura mínima de 90%", "outcome": "${{ steps.check_7.outcome }}"}, {"name": "Validar Terraform do registro
          de imagens", "outcome": "${{ steps.check_8.outcome }}"}, {"name": "Build Terraform sem backend remoto", "outcome":
          "${{ steps.check_9.outcome }}"}, {"name": "06 - Segurança de dependências e configuração", "outcome": "${{ steps.check_10.outcome
          }}"}, {"name": "07 - Observabilidade New Relic configurada", "outcome": "${{ steps.check_11.outcome }}"}, {"name":
          "08 - Conectividade externa real do ambiente de origem", "outcome": "${{ steps.check_12.outcome }}"}, {"name": "09
          - Regressão de endpoints", "outcome": "${{ steps.check_13.outcome }}"}]'
      run: python .github/scripts/ci_summary.py
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
  publish:
    name: Publish image
    needs:
    - route
    - verify
    if: needs.route.outputs.maintenance != 'true' && needs.route.outputs.destroy_request != 'true' && (github.event_name ==
      'push' && !github.event.created && needs.verify.result == 'success' && (github.ref_name == 'develop' || startsWith(github.ref_name,
      'release/') || github.ref_name == 'prod'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: 10 - Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: 11 - Autenticar na AWS por OIDC
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-region: sa-east-1
        role-to-assume: arn:aws:iam::456687462806:role/fiap-gh-deploy-fiap-application
        allowed-account-ids: '456687462806'
    - name: Aplicar Terraform do registro ECR
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Confirmar controle central antes de modificar AWS
      env:
        FIAP_INFRA_STATE: ${{ vars.FIAP_INFRA_STATE }}
      run: python .github/scripts/infra_guard.py
    - name: Atualizar registro ECR protegido
      shell: bash
      run: |
        terraform -chdir=infra/registry init -backend-config=backend.hcl -input=false
        terraform -chdir=infra/registry plan -input=false -out=registry.tfplan
        terraform -chdir=infra/registry apply -input=false -auto-approve registry.tfplan
    - name: Confirmar controle central antes de modificar AWS
      env:
        FIAP_INFRA_STATE: ${{ vars.FIAP_INFRA_STATE }}
      run: python .github/scripts/infra_guard.py
    - name: 12 - Preparar imagem imutável
      id: image
      shell: bash
      env:
        ECR_REPOSITORY: 456687462806.dkr.ecr.sa-east-1.amazonaws.com/fiap-application
        FIAP_RUNTIME_CONFIG: ${{ vars.FIAP_RUNTIME_CONFIG }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}"
        case "$GITHUB_REF_NAME" in
          develop) namespace=develop ;;
          release/*) namespace=homol ;;
          prod) namespace=prod ;;
          *) echo 'Branch de publicação inválida'; exit 2 ;;
        esac
        aws ecr get-login-password --region sa-east-1 | docker login --username AWS --password-stdin 456687462806.dkr.ecr.sa-east-1.amazonaws.com
        exists=$(aws ecr list-images --repository-name fiap-application --filter tagStatus=TAGGED --query "imageIds[?imageTag=='$tag'].imageTag | [0]" --output text)
        if [[ "$exists" == "$tag" ]]; then
          docker pull "$ECR_REPOSITORY:$tag"
        else
          docker build --pull --tag "$ECR_REPOSITORY:$tag" .
        fi
        echo "uri=$ECR_REPOSITORY:$tag" >> "$GITHUB_OUTPUT"
        echo "exists=$exists" >> "$GITHUB_OUTPUT"
        echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
    - name: 13 - Bloquear imagem vulnerável
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.uri }}
        severity: HIGH,CRITICAL
        exit-code: '1'
        trivyignores: .trivyignore
    - name: Confirmar controle central antes de modificar AWS
      env:
        FIAP_INFRA_STATE: ${{ vars.FIAP_INFRA_STATE }}
      run: python .github/scripts/infra_guard.py
      if: steps.image.outputs.exists == 'None'
    - name: 14 - Publicar imagem aprovada
      if: steps.image.outputs.exists == 'None'
      env:
        IMAGE_URI: ${{ steps.image.outputs.uri }}
      run: docker push "$IMAGE_URI"
    - name: Confirmar controle central antes de modificar AWS
      env:
        FIAP_INFRA_STATE: ${{ vars.FIAP_INFRA_STATE }}
      run: python .github/scripts/infra_guard.py
    - name: 15 - Deploy privado e validação real de banco e New Relic
      shell: bash
      env:
        FIAP_RUNTIME_CONFIG: ${{ vars.FIAP_RUNTIME_CONFIG }}
        NAMESPACE: ${{ steps.image.outputs.namespace }}
        IMAGE_URI: ${{ steps.image.outputs.uri }}
      run: |
        set -euo pipefail
        namespace="$NAMESPACE"
        jwt_issuer=$(python -c 'import json,os,sys; c=json.loads(os.environ.get("FIAP_RUNTIME_CONFIG") or "{}"); print(c.get(sys.argv[1],{}).get("issuer",""))' "$namespace")
        test -n "$jwt_issuer" || { echo '::error::FIAP_RUNTIME_CONFIG deve conter o issuer do ambiente'; exit 1; }
        build_id=$(aws codebuild start-build \
          --project-name fiap-eks-deploy \
          --environment-variables-override \
            "name=IMAGE_URI,value=$IMAGE_URI,type=PLAINTEXT" \
            "name=DEPLOY_NAMESPACE,value=$namespace,type=PLAINTEXT" \
            "name=JWT_ISSUER,value=$jwt_issuer,type=PLAINTEXT" \
          --query build.id --output text)
        python .github/scripts/wait_codebuild.py "$build_id"
    - name: 16 - Regressão HTTPS de todas as operações publicadas
      env:
        FIAP_RUNTIME_CONFIG: ${{ vars.FIAP_RUNTIME_CONFIG }}
        NAMESPACE: ${{ steps.image.outputs.namespace }}
      run: python .github/scripts/live_regression.py "$NAMESPACE"
  propose:
    name: Propose
    needs:
    - route
    - verify
    if: |-
      (needs.route.outputs.maintenance != 'true' || startsWith(github.ref_name, 'feature/')) && needs.route.outputs.destroy_request != 'true' && (always() && github.event_name == 'push' && (startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'rollback/') || startsWith(github.ref_name, 'rolback/')) && needs.route.result == 'success' && (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' &&
        (startsWith(github.ref_name, 'rollback/') || startsWith(github.ref_name, 'rolback/')))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: 10 - Checkout da branch enviada
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: 10a - Criar token do GitHub App da organizacao
      if: vars.FIAP_PROMOTION_APP_CLIENT_ID != '' || vars.FIAP_PROMOTION_APP_ID != ''
      id: promotion-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.FIAP_PROMOTION_APP_CLIENT_ID || vars.FIAP_PROMOTION_APP_ID }}
        private-key: ${{ secrets.FIAP_PROMOTION_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - name: 10b - Avisar sobre aprovacao manual da esteira
      if: vars.FIAP_PROMOTION_APP_CLIENT_ID == '' && vars.FIAP_PROMOTION_APP_ID == ''
      run: echo '::warning::Configure o GitHub App de promocao para que PRs gerados automaticamente iniciem a esteira sem
        aprovacao manual.'
    - name: 11 - Abrir PR para develop ou release
      env:
        GH_TOKEN: ${{ steps.promotion-token.outputs.token || secrets.GITHUB_TOKEN }}
      run: python .github/scripts/flow.py promote
    env:
      FIAP_INFRA_STATE: ${{ needs.route.outputs.infra_state }}
  promote:
    name: Promote
    needs:
    - route
    - verify
    - publish
    if: always() && !cancelled() && github.event_name == 'push' && !github.event.created && (github.ref_name == 'develop'
      || startsWith(github.ref_name, 'release/') || github.ref_name == 'prod') && needs.route.result == 'success' && needs.route.outputs.destroy_request
      != 'true' && needs.verify.result == 'success' && (needs.route.outputs.infra_state == 'maintenance' || (needs.route.outputs.infra_state
      == 'active' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: 10 - Checkout do automador
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.ref_name }}
    - name: 10a - Criar token do GitHub App da organizacao
      if: vars.FIAP_PROMOTION_APP_CLIENT_ID != '' || vars.FIAP_PROMOTION_APP_ID != ''
      id: promotion-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.FIAP_PROMOTION_APP_CLIENT_ID || vars.FIAP_PROMOTION_APP_ID }}
        private-key: ${{ secrets.FIAP_PROMOTION_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - name: 10b - Avisar sobre aprovacao manual da esteira
      if: vars.FIAP_PROMOTION_APP_CLIENT_ID == '' && vars.FIAP_PROMOTION_APP_ID == ''
      run: echo '::warning::Configure o GitHub App de promocao para que PRs gerados automaticamente iniciem a esteira sem
        aprovacao manual.'
    - name: 11 - Abrir PR da próxima etapa
      env:
        GH_TOKEN: ${{ steps.promotion-token.outputs.token || secrets.GITHUB_TOKEN }}
      run: python .github/scripts/flow.py promote
    env:
      FIAP_INFRA_STATE: ${{ needs.route.outputs.infra_state }}
