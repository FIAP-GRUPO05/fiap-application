plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.15.0'
    id "org.owasp.dependencycheck" version "12.2.2"
    id "org.sonarqube" version "7.3.0.8198"
}

group = 'com.safiap'
version = '0.0.1-SNAPSHOT'
description = 'tech-challenge-oficina-mecanica'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Spring Boot 3.2 manages Flyway 9.x (no PostgreSQL 17 support). Override to
// Flyway 10.x so PostgreSQL 17 is supported via flyway-database-postgresql.
ext['flyway.version'] = '10.20.1'

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // E-mail (notificações de mudança de status da OS) via SMTP genérico
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'software.amazon.awssdk:lambda:2.25.0'
    // Persistence (PostgreSQL) — added per ADR-002 implementation plan
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Database migrations (Flyway). PostgreSQL 17 requires Flyway 10+, which
    // splits the Postgres support into a dedicated module (flyway-database-postgresql).
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql:10.20.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencyCheck {
    // Relatório de análise de vulnerabilidades (OWASP A06 — componentes desatualizados).
    // Rode com: ./gradlew dependencyCheckAnalyze  -> build/reports/dependency-check-report.html
    formats = ['HTML', 'JSON']
    // Chave da NVD lida de env var (nunca hardcode). Acelera o download da base de CVEs.
    // Gere em https://nvd.nist.gov/developers/request-an-api-key e exporte NVD_API_KEY.
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
    }
    // Report-only por padrão para não quebrar o CI verde. Para transformar em gate
    // de qualidade, troque para 7.0 (falha em achados High/Critical, CVSS >= 7).
    failBuildOnCVSS = 11
    suppressionFile = 'config/dependency-check-suppressions.xml'
}

pitest {
    junit5PluginVersion = '1.2.1'
    targetClasses = [
            'com.safiap.techchallengeoficinamecanica.modules.serviceorder.domain.*',
            'com.safiap.techchallengeoficinamecanica.modules.serviceorder.application.*',
            'com.safiap.techchallengeoficinamecanica.modules.register.domain.*',
            'com.safiap.techchallengeoficinamecanica.modules.notifications.domain.*',
            'com.safiap.techchallengeoficinamecanica.modules.notifications.application.*'
    ]
    targetTests = ['com.safiap.techchallengeoficinamecanica.*']
    excludedTestClasses = ['com.safiap.techchallengeoficinamecanica.integration.*']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}
