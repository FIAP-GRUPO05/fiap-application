spring.application.name=tech-challenge-oficina-mecanica

# Database configuration (env-friendly defaults). Use .env or environment to override secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/oficina_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oficina}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oficina_pass}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator: expose only the health endpoint for container healthchecks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Grupos /actuator/health/{liveness,readiness} usados pelas probes do Kubernetes.
# Explícito em vez de depender da autodetecção: o grupo readiness não inclui o banco,
# então uma oscilação do Postgres não tira todos os pods do Service nem reinicia containers.
management.endpoint.health.probes.enabled=true

# E-mail (SMTP) — notificações de mudança de status da OS
# Local/dev: MailHog (sem auth). Prod: smtp.gmail.com:587 com App Password.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.health.mail.enabled=false

# URL publica pela qual o cliente alcanca a API. Usada nos links de aprovar/recusar
# enviados por e-mail: o envio e assincrono (fora da thread da requisicao), entao a
# base nao pode ser derivada do request. Em producao aponta para o Load Balancer.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
#DEFAULT = SMTP DEFAULT
#LAMBDA = LAMBDA EMAIL
#NONE = ONLY LOG
notifications.email=${MAIL_TIPE:DEFAULT}

notifications.email.from=${NOTIFICATIONS_EMAIL_FROM:nao-responda@oficina.local}

